<style>
/* Layout: lab-bench pages — sticky spec-referenced tab strip; each topic = oscilloscope-style sim + breakdown side by side, flip-card questions beneath. */
:root{
  --paper:#f4f7f6; --surface:#ffffff; --ink:#16212c; --muted:#56636f; --line:#d5dde2; --grid:#e6edf0;
  --accent:#1f5fbf; --accent-soft:#e3ecfa; --wave2:#cf5c17; --node:#c2263d; --good:#1b7a4c; --good-soft:#e2f3ea; --warn-soft:#fbeee4;
  --f-display:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;

  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f151b; --surface:#151d25; --ink:#e5ecf1; --muted:#93a1ad; --line:#2a3540; --grid:#1c2630;
  --accent:#72a6ff; --accent-soft:#1a2a44; --wave2:#ff9a5c; --node:#ff6b80; --good:#4cc38a; --good-soft:#15302a; --warn-soft:#33241a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f151b; --surface:#151d25; --ink:#e5ecf1; --muted:#93a1ad; --line:#2a3540; --grid:#1c2630;
  --accent:#72a6ff; --accent-soft:#1a2a44; --wave2:#ff9a5c; --node:#ff6b80; --good:#4cc38a; --good-soft:#15302a; --warn-soft:#33241a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:28px 14px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4.4vw,42px);line-height:1.08;margin:6px 0 8px;text-wrap:balance;letter-spacing:-.01em}
h1 .sig{display:inline-block;vertical-align:middle;margin-left:6px}
.lede{color:var(--muted);max-width:68ch;margin:0}
h2{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 8px}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-block:8px 0}
.tab{flex:0 0 auto;border:1px solid transparent;border-bottom:none;background:none;color:var(--muted);font:inherit;cursor:pointer;padding:8px 14px 10px;border-radius:8px 8px 0 0;text-align:left;display:flex;flex-direction:column;gap:1px;position:relative;top:1px}
.tab .ref{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em}
.tab .nm{font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--ink)}
.tab:hover .nm{color:var(--accent)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--accent)}
.tab[aria-selected="true"] .nm{color:var(--accent)}
.tab.practice .nm::before{content:"✎ ";}
.tab:focus-visible,button:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:22px 60px}
.panel-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 20px;margin-bottom:18px}
.panel-head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.lab{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.lab{grid-template-columns:minmax(0,1fr)}}

.scope{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.scope-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.scope canvas{display:block;width:100%}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 18px;padding:14px 14px 4px}
.ctl label{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.ctl label output{font-family:var(--f-mono);color:var(--ink);font-size:13px}
.ctl input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0 0}
.toggles{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);color:var(--muted);font:inherit;font-size:14px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.check{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);padding:6px 4px}
.check input{accent-color:var(--accent);width:16px;height:16px}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);margin-top:12px}
.readout div{background:var(--surface);padding:10px 12px}
.readout dt{font-size:12px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.03em}
.readout dd{margin:2px 0 0;font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.status{padding:10px 14px;font-size:14px;border-top:1px solid var(--line)}
.status b{font-family:var(--f-display)}
.pause{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:12px;font-family:var(--f-mono);padding:3px 10px;border-radius:6px;cursor:pointer}

.notes{display:flex;flex-direction:column;gap:16px;min-width:0}
.eqbox{background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.eqbox h3{font-size:14px;font-family:var(--f-mono);font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.eq{font-family:var(--f-mono);font-size:15px;display:flex;flex-wrap:wrap;gap:6px 22px}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:12px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;margin-top:1px}

.try{font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.try b{color:var(--ink)}

.qhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin:36px 0 12px;border-top:1px solid var(--line);padding-top:22px}

.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.qcard.flipped{border-color:var(--good);background:linear-gradient(var(--good-soft),var(--good-soft)) top/100% 4px no-repeat, var(--surface)}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.qmeta .mk{color:var(--accent)}
.qcard.flipped .qmeta .side{color:var(--good)}
.qbody{flex:1;min-width:0}
.qbody p{margin:0 0 8px}
.qbody p:last-child{margin-bottom:0}
.qbody ol,.qbody ul{margin:4px 0 8px;padding-left:20px}
.qbody .opts{list-style:upper-alpha;padding-left:24px}
.ans .work{font-family:var(--f-mono);font-size:13.5px;background:var(--paper);border-radius:8px;padding:8px 10px;margin:6px 0;overflow-x:auto;white-space:pre-wrap}
.ans .final{font-weight:700;color:var(--good)}
.flip{align-self:flex-start;border:1px solid var(--accent);background:none;color:var(--accent);font:inherit;font-size:14px;font-weight:700;padding:6px 14px;border-radius:8px;cursor:pointer}
.flip:hover{background:var(--accent);color:var(--surface)}
.qcard.flipped .flip{border-color:var(--good);color:var(--good)}
.qcard.flipped .flip:hover{background:var(--good);color:var(--surface)}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tally{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.ghost{border:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;cursor:pointer}
.tagline{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
sub,sup{font-size:.72em;line-height:0}
footer{color:var(--muted);font-size:13px;padding-block:0 40px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}

.extra{padding:12px 14px 2px;display:flex;flex-direction:column;gap:10px}
.extra select,.extra input[type=number],.extra input[type=text]{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:100%}
.extra .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.extra .row label{font-size:14px;color:var(--muted)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);font:inherit;font-size:14px;font-weight:700;padding:6px 14px;border-radius:8px;cursor:pointer}
.btn.alt{background:none;color:var(--accent)}
.mini{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.mini th,.mini td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
.mini th{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.tblwrap{overflow-x:auto}
.ok{color:var(--good);font-weight:700}.bad{color:var(--node);font-weight:700}
.crumb{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-decoration:none}
.crumb:hover{color:var(--accent)}
</style>

<script>
/* ---------- shared helpers ---------- */
const $=id=>document.getElementById(id);
const sims={},Q={},TOPICS=[];let SECTION={};
let C={};
function readTokens(){const s=getComputedStyle(document.documentElement);
  ['paper','surface','ink','muted','line','grid','accent','accent-soft','wave2','node','good'].forEach(n=>C[n]=s.getPropertyValue('--'+n).trim());}
function hexRgb(h){h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
function alpha(hex,a){const[r,g,b]=hexRgb(hex);return `rgba(${r},${g},${b},${a})`}
function nmRgb(nm){let r=0,g=0,b=0;
  if(nm<440){r=-(nm-440)/40;b=1}else if(nm<490){g=(nm-440)/50;b=1}else if(nm<510){g=1;b=-(nm-510)/20}
  else if(nm<580){r=(nm-510)/70;g=1}else if(nm<645){r=1;g=-(nm-645)/65}else{r=1}
  let f=nm<420?0.3+0.7*(nm-380)/40:nm>680?0.3+0.7*(780-nm)/100:1;
  return [Math.round(255*r*f),Math.round(255*g*f),Math.round(255*b*f)];}
const rgbStr=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const fmt=(x,d=2)=>Number(x).toFixed(d);
const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
function sci(x,d=2){if(!isFinite(x))return '—';if(x===0)return'0';let e=Math.floor(Math.log10(Math.abs(x)));let m=x/10**e;if(Math.abs(+m.toFixed(d))>=10){m/=10;e++}
  if(e>=-2&&e<=3)return (+x.toPrecision(d+1)).toString();
  return `${m.toFixed(d)} × 10${String(e).replace('-','⁻').replace(/\d/g,c=>SUP[c])}`}
function sizeCanvas(c,aspect,minH){
  const w=c.clientWidth||c.parentElement.clientWidth||600; const h=Math.max(minH||0,Math.round(w*aspect));
  const dpr=Math.min(2,window.devicePixelRatio||1);
  if(c._w!==w||c._h!==h){c.style.height=h+'px';c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);c._w=w;c._h=h}
  const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,w,h};}
function bg(ctx,w,h,grid=true){ctx.fillStyle=C.surface;ctx.fillRect(0,0,w,h);if(!grid)return;ctx.strokeStyle=C.grid;ctx.lineWidth=1;ctx.beginPath();
  for(let x=0.5;x<w;x+=20){ctx.moveTo(x,0);ctx.lineTo(x,h)}for(let y=0.5;y<h;y+=20){ctx.moveTo(0,y);ctx.lineTo(w,y)}ctx.stroke();}
function label(ctx,t,x,y,col,align='center',size=12,weight=500){ctx.fillStyle=col||C.ink;ctx.font=`${weight} ${size}px "JetBrains Mono", ui-monospace, monospace`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,x,y)}
function dot(ctx,x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function line(ctx,x1,y1,x2,y2,col,w=1.5,dash){ctx.strokeStyle=col;ctx.lineWidth=w;if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();if(dash)ctx.setLineDash([])}
function arrowHead(ctx,x,y,ang,s,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-s*Math.cos(ang-0.4),y-s*Math.sin(ang-0.4));ctx.lineTo(x-s*Math.cos(ang+0.4),y-s*Math.sin(ang+0.4));ctx.closePath();ctx.fill()}
function arrow(ctx,x1,y1,x2,y2,col,w=2,head=9){line(ctx,x1,y1,x2,y2,col,w);if(Math.hypot(x2-x1,y2-y1)>2)arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),head,col)}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
/* graph helper: box {x,y,w,h} in px, ranges [min,max] */
function Plot(ctx,box,xr,yr){const P={
  X:v=>box.x+(v-xr[0])/(xr[1]-xr[0])*box.w, Y:v=>box.y+box.h-(v-yr[0])/(yr[1]-yr[0])*box.h,
  axes(xlab,ylab,xt=[],yt=[],xf=v=>v,yf=v=>v){ctx.strokeStyle=C.muted;ctx.lineWidth=1;ctx.beginPath();
    const y0=yr[0]<=0&&yr[1]>=0?P.Y(0):box.y+box.h, x0=xr[0]<=0&&xr[1]>=0?P.X(0):box.x;
    ctx.moveTo(box.x,y0);ctx.lineTo(box.x+box.w,y0);ctx.moveTo(x0,box.y);ctx.lineTo(x0,box.y+box.h);ctx.stroke();
    xt.forEach(v=>{const x=P.X(v);line(ctx,x,y0,x,y0+4,C.muted,1);label(ctx,xf(v),x,y0+13,C.muted,'center',10)});
    yt.forEach(v=>{const y=P.Y(v);line(ctx,x0-4,y,x0,y,C.muted,1);label(ctx,yf(v),x0-7,y,C.muted,'right',10)});
    if(xlab)label(ctx,xlab,box.x+box.w,y0+(y0>box.y+box.h-20?-10:26),C.muted,'right',10);
    if(ylab)label(ctx,ylab,x0+6,box.y-8,C.muted,'left',10);},
  curve(f,col,w=2,a=xr[0],b=xr[1],n=200){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();let first=true;
    for(let i=0;i<=n;i++){const x=a+(b-a)*i/n,y=f(x);if(!isFinite(y)){first=true;continue}const py=Math.max(box.y-2,Math.min(box.y+box.h+2,P.Y(y)));first?ctx.moveTo(P.X(x),py):ctx.lineTo(P.X(x),py);first=false}ctx.stroke();},
  pts(arr,col,w=2){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();arr.forEach((p,i)=>i?ctx.lineTo(P.X(p[0]),P.Y(p[1])):ctx.moveTo(P.X(p[0]),P.Y(p[1])));ctx.stroke();}
 };return P;}
function segVal(id){const b=document.querySelector(`#${id} button[aria-pressed="true"]`);return b?b.dataset.v:null}
function setSeg(id,v){document.querySelectorAll(`#${id} button`).forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v))}
const num=id=>+$(id).value;
function setOut(id,txt){const o=$(id+'-o');if(o)o.textContent=txt}
function setLabel(id,txt){const l=document.querySelector(`label[for="${id}"]`);if(l)l.firstChild.textContent=txt+' '}
function topic(t){TOPICS.push(t)}

// TITLE: Measurements Revision Lab
SECTION={code:'Section 3.1 Measurements and their errors',name:'measurements and errors',title:'Measurements Revision Lab',
 lede:'The practical skills behind every other topic: errors, uncertainties, graphs, units and reading instruments. Each tab has an interactive tool, a step-by-step breakdown and questions with hidden answers.'};

/* ===== ERRORS ===== */
topic({id:'errors',ref:'3.1.2',name:'Errors & accuracy',short:'Errors',eyebrow:'Limitation of physical measurements',title:'Random and systematic errors',
 intro:'Ten students measure g. Change the size of the random error and add a systematic error, then see how precision and accuracy change.',
 bar:'readings of g / m s⁻² · accepted value 9.81',aspect:0.5,minH:230,
 controls:[{id:'er-rand',label:'Random error size',min:0,max:0.3,step:0.01,value:0.10,fmt:v=>'±'+fmt(v)},
  {id:'er-sys',label:'Systematic error',min:-0.4,max:0.4,step:0.02,value:0,fmt:v=>(v>0?'+':'')+fmt(v)},
  {id:'er-n',label:'Number of readings',min:3,max:20,step:1,value:8,fmt:v=>v}],
 extra:`<div class="row"><button class="btn alt" type="button" id="er-new">Take new readings</button></div>`,
 readouts:[{id:'er-mean',label:'mean'},{id:'er-unc',label:'uncertainty (½ range)'},{id:'er-pu',label:'% uncertainty'},{id:'er-pd',label:'% difference from 9.81'}],status:true,
 eqs:['uncertainty ≈ ½ × range','% uncertainty = (uncertainty ÷ value) × 100','% difference = |value − accepted| ÷ accepted × 100'],
 steps:['<b>Random errors</b> make readings scatter unpredictably either side of the true value (reaction time, judging when something stops). Repeating and averaging reduces their effect.',
  '<b>Systematic errors</b> shift every reading the same way by the same amount (zero error, miscalibrated meter, parallax from the same position). Repeating does <b>not</b> remove them.',
  '<b>Precise</b> means repeated readings agree closely (small spread). <b>Accurate</b> means close to the true value.',
  'Estimate the uncertainty in a set of repeats as <b>half the range</b>, ignoring clear anomalies.',
  '<b>Resolution</b> is the smallest change an instrument can show. <b>Repeatable</b>: same person, same method, same result. <b>Reproducible</b>: different person or method, same result.'],
 traps:['Saying repeating readings "reduces systematic error". It doesn\'t.','Confusing precision (spread) with accuracy (closeness to true value).','Quoting uncertainty to too many significant figures: 1 or 2 s.f. is enough.'],
 tryThis:'set random error to ±0.02 and systematic to +0.30. Are the readings precise? Are they accurate?'});
sims.errors=(()=>{let z=[];const g0=9.81;
  function regen(n){z=[];for(let i=0;i<n;i++){const u=Math.random()||0.5,v=Math.random();z.push(Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v))}}
  let R=[];
  function readings(){const r=num('er-rand'),s=num('er-sys'),n=num('er-n');if(z.length!==n){while(z.length<n){const u=Math.random()||.5,v=Math.random();z.push(Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v))}z.length=n}
    R=z.map(q=>Math.round((g0+s+r*q*0.6)*100)/100);}
  return{init(){regen(8);$('er-new').addEventListener('click',()=>{regen(num('er-n'));this.update()})},
   update(){readings();const n=R.length,mean=R.reduce((a,b)=>a+b,0)/n,mx=Math.max(...R),mn=Math.min(...R),u=(mx-mn)/2,pu=u/mean*100,pd=Math.abs(mean-g0)/g0*100;
    $('er-mean').textContent=fmt(mean)+' m s⁻²';$('er-unc').textContent='± '+fmt(u)+' m s⁻²';$('er-pu').textContent=fmt(pu,1)+' %';$('er-pd').textContent=fmt(pd,1)+' %';
    const precise=pu<1,accurate=pd<1||(Math.abs(mean-g0)<=u);
    $('errors-status').innerHTML=precise&&accurate?'<b>Precise and accurate.</b> Readings agree closely and the mean is close to 9.81.':
      precise?'<b>Precise but not accurate.</b> Readings agree closely but the mean is shifted: a sign of systematic error, e.g. a zero error.':
      accurate?'<b>Accurate but not precise.</b> The mean is close to 9.81 but the readings are widely spread: large random errors.':
      '<b>Neither precise nor accurate.</b> Large spread and a shifted mean.';},
   draw(ctx,w,h){bg(ctx,w,h);const P=Plot(ctx,{x:30,y:30,w:w-60,h:h-80},[9.2,10.4],[0,1]);const y0=P.Y(0);
    line(ctx,30,y0,w-30,y0,C.muted,1);for(let v=9.2;v<=10.401;v+=0.1){const x=P.X(v);line(ctx,x,y0,x,y0+5,C.muted,1);if(Math.round(v*10)%2===0)label(ctx,v.toFixed(1),x,y0+16,C.muted,'center',10)}
    const xt=P.X(g0);line(ctx,xt,26,xt,y0,C.good,2,[5,4]);label(ctx,'accepted 9.81',xt,16,C.good,'center',11);
    const stack={};R.forEach(v=>{const k=Math.round(v*50);stack[k]=(stack[k]||0)+1;const x=P.X(Math.min(10.4,Math.max(9.2,v)));dot(ctx,x,y0-10-(stack[k]-1)*13,5.5,C.accent)});
    if(R.length){const mean=R.reduce((a,b)=>a+b,0)/R.length,x=P.X(mean);ctx.fillStyle=C.wave2;ctx.beginPath();ctx.moveTo(x,y0+26);ctx.lineTo(x-7,y0+38);ctx.lineTo(x+7,y0+38);ctx.fill();label(ctx,'mean',x,y0+47,C.wave2,'center',10);
     const a=P.X(Math.min(...R)),b=P.X(Math.max(...R)),by=Math.max(40,y0-30-Math.max(...Object.values(stack))*13);ctx.strokeStyle=C.muted;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(a,by+5);ctx.lineTo(a,by);ctx.lineTo(b,by);ctx.lineTo(b,by+5);ctx.stroke();label(ctx,'range',(a+b)/2,by-9,C.muted,'center',10)}}
  }})();

 function fresh(){R=(Math.floor(Math.random()*2400)+50)/100;Z=$('mi-zero').checked?[3,-2,4,-3,2,5][Math.floor(Math.random()*6)]/100:0;
  $('micrometer-bar').textContent=Z?`with the jaws closed the gauge reads ${Z>0?'+':''}${fmt(Z)} mm`:'resolution 0.01 mm · no zero error';$('mi-ans').value='';
  $('micrometer-status').innerHTML='Read the scale and enter your answer.';}
 return{init(){fresh();$('mi-new').addEventListener('click',fresh);$('mi-zero').addEventListener('change',fresh);
   $('mi-check').addEventListener('click',()=>{const a=parseFloat($('mi-ans').value),t=R-Z;if(isNaN(a)){$('micrometer-status').innerHTML='Type a reading first.';return}
     $('micrometer-status').innerHTML=Math.abs(a-t)<0.005?`<span class="ok">Correct: ${fmt(t)} mm.</span>`:`<span class="bad">Not quite.</span> Check the half-millimetre line${Z?' and the zero error':''}, then try again.`});
   $('mi-show').addEventListener('click',()=>{const s=Math.floor(R*2)/2,th=Math.round((R-s)*100);$('micrometer-status').innerHTML=`Sleeve ${fmt(s)} mm + thimble ${th} × 0.01 = ${fmt(R)} mm${Z?` ; minus zero error (${fmt(Z)}) = <b>${fmt(R-Z)} mm</b>`:''}.`});},
  draw(ctx,w,h){bg(ctx,w,h,false);const edge=w*0.6,dy=h*0.5,k=Math.min(26,w/26),sh=h*0.34;
   ctx.fillStyle=C.paper;ctx.fillRect(20,dy-sh/2,edge-20,sh);ctx.strokeStyle=C.muted;ctx.strokeRect(20,dy-sh/2,edge-20,sh);
   line(ctx,20,dy,edge,dy,C.ink,1.5);
   for(let v=0;v<=R+1e-9;v+=0.5){const x=edge-(R-v)*k;if(x<24)continue;const whole=Math.abs(v-Math.round(v))<1e-6;
    if(whole){line(ctx,x,dy,x,dy-sh*0.28,C.ink,1.5);if(Math.round(v)%5===0)label(ctx,String(Math.round(v)),x,dy-sh*0.28-10,C.ink,'center',12,700)}else line(ctx,x,dy,x,dy+sh*0.22,C.ink,1.5)}
   const tw=w*0.28,th=h*0.78;const g=ctx.createLinearGradient(0,dy-th/2,0,dy+th/2);g.addColorStop(0,C.line);g.addColorStop(0.5,C.surface);g.addColorStop(1,C.line);
   ctx.fillStyle=g;rrect(ctx,edge,dy-th/2,tw,th,6);ctx.fill();ctx.strokeStyle=C.muted;ctx.stroke();
   const frac=(R-Math.floor(R*2)/2)*100,sp=th/16;
   for(let n=Math.floor(frac)-9;n<=Math.ceil(frac)+9;n++){const y=dy-(n-frac)*sp;if(y<dy-th/2+4||y>dy+th/2-4)continue;const nn=((n%50)+50)%50;const long=nn%5===0;
    line(ctx,edge,y,edge+(long?tw*0.32:tw*0.2),y,C.ink,1.3);if(long)label(ctx,String(nn),edge+tw*0.32+8,y,C.ink,'left',12,700)}
   label(ctx,'sleeve',30,dy+sh/2+14,C.muted,'left',10);label(ctx,'thimble',edge+tw/2,dy+th/2+12,C.muted,'center',10);label(ctx,'datum line',30,dy-8,C.muted,'left',9);}}})();

/* ---------- build page ---------- */
(function build(){
  const S=SECTION;
  const ctlHTML=c=>`<div class="ctl"><label for="${c.id}">${c.label} <output id="${c.id}-o"></output></label><input type="range" id="${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}"></div>`;

  const chkHTML=c=>`<label class="check"><input type="checkbox" id="${c.id}"${c.checked?' checked':''}> ${c.label}</label>`;
  const panel=t=>`
<section class="panel" role="tabpanel" data-panel="${t.id}" hidden>
  <div class="panel-head"><div><div class="eyebrow">${t.eyebrow}</div><h2>${t.title}</h2><p>${t.intro}</p></div></div>
  <div class="lab">
    <div class="scope">
      <div class="scope-bar"><span id="${t.id}-bar">${t.bar||''}</span>${t.animated?`<button class="pause" type="button" data-pause="${t.id}">Pause</button>`:''}</div>
      <canvas id="c-${t.id}" aria-label="${t.canvasLabel||t.title}"></canvas>
      ${(t.segs||t.checks)?`<div class="toggles">${(t.segs||[]).map(segHTML).join('')}${(t.checks||[]).map(chkHTML).join('')}</div>`:''}
      ${t.controls?`<div class="controls">${t.controls.map(ctlHTML).join('')}</div>`:''}
      ${t.extra?`<div class="extra">${t.extra}</div>`:''}
      ${t.readouts?`<dl class="readout">${t.readouts.map(r=>`<div${r.wide?' style="grid-column:1/-1"':''}><dt>${r.label}</dt><dd id="${r.id}"></dd></div>`).join('')}</dl>`:''}
      ${t.status?`<div class="status" id="${t.id}-status"></div>`:''}
    </div>
    <div class="notes">
      <div class="eqbox"><h3>${t.eqTitle||'Key equations'}</h3><div class="eq">${t.eqs.map(e=>`<span>${e}</span>`).join('')}</div></div>
      <div><h3>Breaking it down</h3><ol class="steps">${t.steps.map(s=>`<li><div>${s}</div></li>`).join('')}</ol></div>
      <div class="traps"><h3>Common traps</h3><ul>${t.traps.map(s=>`<li>${s}</li>`).join('')}</ul></div>

  const chips=[['all','All'],['mc','Multiple choice'],...TOPICS.map(t=>[t.id,t.short||t.name]),['extended','6-mark']];
  document.getElementById('app').innerHTML=`
<div class="wrap"><header class="top">
  <div class="eyebrow">AQA A-level Physics 7408 · ${S.code}</div>

/* ---------- question cards ---------- */
function card(item,idx,lab){
  const el=document.createElement('article');el.className='qcard';el.dataset.tags=item.t||'';
  el.innerHTML=`<div class="qmeta"><span class="side">${lab} ${idx+1}</span><span class="mk">${item.m} mark${item.m>1?'s':''}</span></div>
    <div class="qbody front">${item.q}</div>
    <div class="qbody ans back" hidden><div class="tagline" style="margin-bottom:6px">Answer</div>${item.a}</div>
    <button class="flip" type="button">Show answer</button>`;
  const btn=el.querySelector('.flip'),front=el.querySelector('.front'),back=el.querySelector('.back'),side=el.querySelector('.side');
  btn.addEventListener('click',()=>{const show=back.hidden;back.hidden=!show;front.hidden=show;el.classList.toggle('flipped',show);
    btn.textContent=show?'Back to question':'Show answer';side.textContent=(show?'Answer ':lab+' ')+(idx+1);});
  return el;}
document.querySelectorAll('[data-qset]').forEach(g=>{const set=g.dataset.qset;(Q[set]||[]).forEach((it,i)=>g.appendChild(card(it,i,set==='practice'?'P':'Q')))});
const pgrid=document.querySelector('[data-qset="practice"]');
function applyFilter(f){let n=0,marks=0;pgrid.querySelectorAll('.qcard').forEach((c,i)=>{const show=f==='all'||c.dataset.tags.split(' ').includes(f);c.hidden=!show;if(show){n++;marks+=Q.practice[i].m}});
  $('tally').textContent=`${n} questions · ${marks} marks`;}
$('filters').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));applyFilter(b.dataset.f)});
$('reset').addEventListener('click',()=>pgrid.querySelectorAll('.qcard.flipped .flip').forEach(b=>b.click()));
applyFilter('all');

/* ---------- theme ---------- */
readTokens();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readTokens)}catch(e){}
new MutationObserver(readTokens).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','class','style']});

/* ---------- wire controls ---------- */
TOPICS.forEach(t=>{const s=sims[t.id]||{};const upd=()=>{(t.controls||[]).forEach(c=>setOut(c.id,c.fmt?c.fmt(+$(c.id).value):$(c.id).value));s.update&&s.update()};
  (t.controls||[]).forEach(c=>$(c.id).addEventListener('input',upd));
  (t.checks||[]).forEach(c=>$(c.id).addEventListener('change',upd));
  (t.segs||[]).forEach(sg=>$(sg.id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setSeg(sg.id,b.dataset.v);s.onSeg&&s.onSeg(sg.id,b.dataset.v);upd()}));
  s.init&&s.init();upd();t._upd=upd;});

/* ---------- tabs + animation ---------- */
const tabs=[...document.querySelectorAll('.tab')];let active=TOPICS[0].id;const times={},paused={};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function show(id,push){if(!document.querySelector(`[data-panel="${id}"]`))id=TOPICS[0].id;active=id;
  tabs.forEach(t=>{const on=t.dataset.tab===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1});
  document.querySelectorAll('.panel').forEach(p=>p.hidden=p.dataset.panel!==id);
  if(push&&location.hash!=='#'+id){try{history.replaceState(null,'','#'+id)}catch(e){}}
  const t=tabs.find(t=>t.dataset.tab===id);t&&t.scrollIntoView({block:'nearest',inline:'nearest'});
  drawActive();}
tabs.forEach(t=>t.addEventListener('click',()=>{show(t.dataset.tab,true);window.scrollTo({top:0})}));
$('tablist').addEventListener('keydown',e=>{const i=tabs.findIndex(t=>t.dataset.tab===active);let j=i;
  if(e.key==='ArrowRight')j=(i+1)%tabs.length;else if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;else return;
  e.preventDefault();show(tabs[j].dataset.tab,true);tabs[j].focus();});
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
document.querySelectorAll('[data-pause]').forEach(b=>{const k=b.dataset.pause;paused[k]=reduce;b.textContent=reduce?'Play':'Pause';
  b.addEventListener('click',()=>{paused[k]=!paused[k];b.textContent=paused[k]?'Play':'Pause'})});
function drawActive(){const s=sims[active],t=TOPICS.find(x=>x.id===active);if(!s||!s.draw)return;const cv=$('c-'+active);
  const{ctx,w,h}=sizeCanvas(cv,t.aspect||0.55,t.minH||240);s.draw(ctx,w,h,times[active]||0);}
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;const s=sims[active],t=TOPICS.find(x=>x.id===active);
  if(s&&t){if(t.animated&&!paused[active]){times[active]=(times[active]||0)+dt;s.step&&s.step(dt,times[active])}drawActive()}
  requestAnimationFrame(loop)}
show(location.hash.slice(1)||TOPICS[0].id);requestAnimationFrame(loop);
